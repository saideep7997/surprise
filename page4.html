<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Just for you 💖</h1>

  <div class="video-container">
    <video id="surpriseVideo" controls autoplay playsinline>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    // Navigate to page5.html when the video finishes
    const vid = document.getElementById('surpriseVideo');
    if (vid) {
      vid.addEventListener('ended', () => {
        // After 5 seconds, go to the video page (current page3)
      setTimeout(() => {
        window.location.href = 'page5.html'; // change to your video page
      }, 1000);
        
      });
    }
  </script>

</body>
</html>
